<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos em HTML5</title>
</head>
<body>
    <h1>Vídeos hospedados localmente</h1>
    <video width="560" controls>
        <source src="media/Video-Pexels.mkv" type="video/mkv">
        <source src="media/Video-Pexels.webm" type="video/webm">
        <source src="media/video-pexels.mp4" type="video/mp4">
        <p>Infelizmente o seu navegador não possui compatibilidade com a reprodução de vídeos.</p>
        <!--Esse tipo de montagem segue a mesma lógica de ordem do exercício de imagens e músicas.-->
    </video>

    <h1>Vídeos hospedados externamente</h1>
    <h2>Vídeo do youtube</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/OzUnqQk4eOg?si=aywnBb3gMbJwMhsx" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
