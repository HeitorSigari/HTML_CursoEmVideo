<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>
    <style>
        div{
            background-color: rgba(148, 147, 147, 0.63);
            width: 200px;
            height: 200px;
            text-align: center;
            border: 1px solid black; /*shorthand de border*/
            display: inline-block;
        }

        /* Pseudo-classes são representadas com : em seguida de um elemento */

        /* Pseudo-classes são "configurações de estado" de um elemento */

        div:hover{ 
            background-color: yellow;
        }
    </style>
</head>

<body>
    <div>01</div> <!--div é um "espaço", a princípio sem significado, criado no documento-->
    <div>02</div>
    <div>03</div>
</body>
</html>
