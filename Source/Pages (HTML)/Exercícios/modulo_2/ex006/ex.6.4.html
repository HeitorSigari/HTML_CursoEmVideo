<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seletores "children"</title>
    <style>
        /*
            Seletores children selecionam o elemento "filho" do outro, isto é, que está contido no outro.
            Para tanto, usa-se > entre os elementos. 
        */

        div > p{
            display: none;
        }

        div:hover > p{
            display: block;
            background-color: red;
            width: 200px;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Exemplo de hover</h1>
    <p>Passe o mouse sobre o texto abaixo.</p>
    <div>
        Passe o mouse aqui.
        <p>TEXTO ESCONDIDO...</p>
    </div>
    <p>Fim do exemplo.</p>
</body>
</html>
