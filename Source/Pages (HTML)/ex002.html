<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos e quebras de linha</title>
</head>
<body>
    <h1>Como funcionam os parágrafos e quebras de linha?</h1>
    <p>Você pode escrever um parágrafos
        de qualquer
        jeito.
        Basta colocar tudo dentro das tags &lt;p&gt; e &lt;/p&gt;.
    </p>
    <p>Para acrescescentar quebras de linha <br> como essa,
    basta utilizar a tag &lt;br&gt; no local desejado.</p>
</body>
</html>
