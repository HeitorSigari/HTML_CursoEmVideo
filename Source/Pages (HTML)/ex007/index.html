<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhando com links</title>
</head>
<body>
    <h1>Links externos</h1>
    <p>Você pode acessar o perfil do professor Guanabara no github clicando 
        <a href="https://github.com/gustavoguanabara" target="_blank" rel="external">aqui!</a> <!--"rel" ajuda os mecanismos de busca a saber a natureza do link-->
        <!--A tag "a" vem de âncora; o parâmetro "href" vem de referência a um hipertexto;-->
        <!-- O parâmetro "target" com valor "_blank" é utilizado para abrir o site desejado em um outra janela-->
    </p>
</body>
</html>
